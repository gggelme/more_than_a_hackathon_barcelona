[project]
name = "more-than-a-hack-2027"
version = "0.1.0"
description = "More Than A Hack 2027 - ball possession"
authors = [
    { name = "gggelme", email = "gelmettisantiago@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.5.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "kloppy>=3.19.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "torch",
    "torchvision",
    "ultralytics>=8.4.202",
]

[tool.uv]
package = false

# PyTorch with CUDA. PyPI only ships the CPU build for Windows, so torch and torchvision come from
# PyTorch's own index instead.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
